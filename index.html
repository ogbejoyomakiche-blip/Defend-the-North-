<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ODTN Crisis Decision Simulator</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1b1f24;--mute:#5d6670;--line:#dcd8cf;--accent:#0b5e8a;--good:#1e7a46;--bad:#b3261e;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}.wrap{max-width:720px;margin:auto;padding:14px}.brand{font:700 13px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.brand b{background:#b3261e;color:white;padding:4px 7px;border-radius:3px}.ticker{font:13px/1.4 system-ui,sans-serif;color:var(--mute);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:12px}h1{font-size:26px;line-height:1.2}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}.tag{font:700 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.m{font:11px/1.2 system-ui,sans-serif;color:var(--mute)}.bar{height:8px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.bar i.low{background:var(--bad)}button.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;cursor:pointer}button:focus,a:focus{outline:3px solid #f0ad4e;outline-offset:2px}button.go{background:var(--accent);color:white;border:0;border-radius:8px;padding:12px 18px;font:600 15px system-ui,sans-serif;cursor:pointer}.msg{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0}.msg small{display:block;font:12px system-ui,sans-serif;color:var(--mute)}.fb{border-left:3px solid var(--good);padding-left:10px}.fb.warn{border-color:var(--bad)}.up{color:var(--good)}.dn{color:var(--bad)}.small{font:13px/1.4 system-ui,sans-serif;color:var(--mute)}.hide{display:none}nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}nav a,.chip{font:600 13px system-ui,sans-serif;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:20px;cursor:pointer}nav a.on,.chip.on{background:var(--accent);color:white}input,textarea{width:100%;font:16px system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}textarea{min-height:110px}dt{font-weight:bold;margin-top:10px}dd{margin:2px 0 0}@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--ink:#eceae4;--mute:#9aa3ad;--line:#2e343c;--accent:#5bb4e5;--good:#5fd08a;--bad:#ff6b61;color-scheme:dark}}
</style>
</head>
<body><div class="wrap">
<div class="brand"><b>ODTN</b> NEWS · SIMULATION</div>
<nav id="nav"><a href="#home">Home</a><a href="#play">Simulator</a><a href="#news">News</a><a href="#glossary">Glossary</a></nav>
<div class="ticker" id="ticker" aria-live="polite"></div><main id="app"></main>
<p class="small">Fictional scenario inspired by the Operation Defend the North tabletop exercise (CyberX).</p>
</div>
<script>
'use strict';
const METERS=[['safety','Patient care'],['trust','Public trust'],['reg','Regulatory standing'],['evid','Evidence'],['team','Team wellbeing']];
// Each option is [label, meter changes, feedback, incorrect].
const R=[
{t:'Hour 1 · Saturday 9:40 a.m.',head:'Payments are down at all three pharmacies',inject:[['ODTN News','Cyber incident halts prescription refills and essential purchases, putting patients’ health at serious risk.'],['Mark (IT)','Card terminals are dead. The ODN Pay vendor says the last update went through, but everything is broken. They urge us to turn the system off.']],q:'The vendor wants the server powered off. You don’t yet know if this is an attack. What do you do?',o:[['Power it off as the vendor asks',{safety:5,reg:-5,evid:-20},'Powering off can erase volatile logs and evidence. Ask questions before following the vendor’s request.',true],['Disconnect it from the network but leave it powered on',{reg:5,evid:15},'Good call. Isolating without shutting down contains risk and preserves forensic evidence.',false],['Leave it running and wait for the vendor’s patch',{safety:-5,trust:-5,reg:-5,evid:-5},'Waiting leaves an unknown risk connected to your network.',true]]},
{t:'Hour 2 · 10:25 a.m.',head:'An unapproved email goes to staff and customers',inject:[['Email from Andrew (Business Dev)','ODN Pay is having an issue. Please tell customers we’re working with our partners. Consider manual payment options or holding prescriptions for pickup.'],['Ian (Business Dev manager)','Andrew shouldn’t have sent that, but customers need to hear something or they’ll lose faith in us.']],q:'Andrew’s email wasn’t authorized. How do you handle it?',o:[['Let it stand. Customers need information and it’s harmless',{safety:3,trust:-5,reg:-10,team:-3},'One unapproved message today means many conflicting ones tomorrow. It also bypassed legal review.',true],['Quietly ask staff to ignore it and say nothing publicly',{safety:-3,trust:-10,reg:-3,team:-5},'Silence leaves people guessing, and the email has already gone out.',true],['Have comms issue one approved holding message and name a single spokesperson',{safety:3,trust:10,reg:8,team:5},'Right move. A single authorized voice, reviewed by legal, stops conflicting messages.',false]]},
{t:'Hour 4 · 12:30 p.m.',head:'The word that changes everything',inject:[['Board adviser','The board wants to know: is this a breach?'],['Legal','Once we say “breach,” notification clocks start for regulators and individuals.']],q:'There is no evidence yet that data was accessed. What do you call this?',o:[['“A confirmed data breach”',{trust:-10,reg:-15,team:-3},'Premature. Do not make a legal finding without evidence.',true],['“A suspected security incident under investigation”',{trust:5,reg:12,team:3},'Correct. Accurate and cautious; it keeps your options open without understating the situation.',false],['“Just an IT outage”',{trust:-5,reg:-12},'If this later proves to be an attack, this may look like a cover-up.',true]]},
{t:'Hour 6 · 2:15 p.m.',head:'Roll back, or bring in something new?',inject:[['IT Ops','Option A: roll back to last week’s version, but it carries a critical vulnerability. Option B: emergency cellular payment provider, but nobody is trained on it.'],['Incident Commander','Whatever we pick, I want it documented and auditable.']],q:'Which path do you approve?',o:[['Roll back, add compensating controls, and keep the current state preserved',{safety:5,trust:3,reg:5,evid:10,team:-3},'Reasonable. Mitigate the known risk, protect evidence, and document the reversible rollback.',false],['Deploy the untested emergency provider',{safety:6,trust:-3,reg:-10,team:-8},'It restores payments fast, but creates governance, training and audit gaps.',true],['Do neither and wait for the vendor’s patch',{safety:-10,trust:-8,reg:-3},'Patients still can’t get medication. Waiting without a plan B is costly.',true]]},
{t:'Hour 8 · 4:00 p.m.',head:'Patients are waiting for insulin',inject:[['ODTN News','A woman with diabetes tells our reporter she has waited all morning. “I can’t take the insulin shot without my breakfast.”'],['Store manager','We could dispense what’s urgent and settle payments later.']],q:'How do you get urgent medication to people?',o:[['Triage by urgency, use ID plus the prescription, and collect payment later',{safety:15,trust:10,reg:3,team:-2},'Best answer. Manual, documented triage protects patients and leaves a paper trail for reconciliation.',false],['Stay closed until systems are back',{safety:-20,trust:-15},'Patient safety comes first. Life-saving medication can’t wait on a payment terminal.',true],['Hand out medication freely with no records',{safety:8,trust:2,reg:-15,team:-3},'Compassionate but risky. Records are needed for inventory, billing and audit.',true]]},
{t:'Hour 12 · 8:00 p.m.',head:'The mayor’s office asks: who’s attacking us?',inject:[['Mayor’s office','Council needs something to say tonight. If we’re under attack, why, and by whom?'],['Threat intel','We have IP addresses and logs. Attribution is not our call to make.']],q:'How do you respond?',o:[['Share indicators with CCCS and the RCMP, tell the mayor attribution is for them',{trust:8,reg:10,evid:5,team:3},'Right. Stick to your role and share intelligence with agencies that can attribute properly.',false],['Tell the mayor it’s probably a nation state',{trust:-10,reg:-8},'Speculation can spread fast and cause harm if wrong.',true],['Don’t respond to the mayor’s office',{trust:-8,reg:-5},'Silence breeds rumor. A calm, factual reply costs little.',true]]}
];
const LESSONS=['Preserve evidence: disconnect, don’t power off.','One approved voice. Hold statements ready before you need them.','Say “suspected incident” until legal confirms a breach.','Shadow IT is a governance failure. Vendors need inventory, monitoring and a continuity plan.','Patient safety beats payment systems. Have a manual downtime process.','Leave attribution to law enforcement and CCCS. Share your indicators.'];
const NEWS=[['Retail','Payments','Rocket Ledger Express terminals fail before the holidays','Merchants across Canada report they cannot process card payments after an update to third-party payment software.'],['Healthcare','Pharmacy','Cyber incident halts prescription refills','Pharmacies report they cannot fill insulin and heart medication as the ODN Pay software stops working.'],['Healthcare','Patients','Patients wait hours for insulin','A woman with diabetes says she cannot take her shot without breakfast and has waited all morning.'],['Government','Municipality','Tax payments fail in 37 Lakes','Residents report declined payments and double charges as the town investigates remote root logins.'],['Transit','Riders','Transit card refills fail','Riders cannot refill cards, and an unauthorized alert tells them to find other ways to pay.'],['Vendor','Root cause','Vendor’s SSH library was misconfigured','Investigators say a late patch and a misconfiguration put development keys into customer systems.']];
const CATS=['All','Retail','Healthcare','Government','Transit','Vendor'];
const GL=[['Shadow IT','Software adopted without IT or security approval; it may lack monitoring, governance or continuity planning.'],['Incident vs breach','An incident may harm security. A breach is a legal finding of unauthorized data access and may start notification deadlines.'],['IOC','Indicator of compromise: a clue such as an IP address or file hash that suggests an attack.'],['Containment','Stopping a problem from spreading without destroying evidence.'],['Eradication','Removing the cause, such as malicious files or bad credentials.'],['Playbook','A pre-written set of steps and roles for an incident.'],['Incident commander','The person coordinating response and decisions.'],['SIEM','A tool that collects and correlates logs to spot suspicious activity.'],['Forensics','Careful collection and analysis of evidence. Powering off can destroy volatile evidence.'],['Third-party risk','Exposure created by vendors and partners who touch systems or data.'],['RTO / RPO','Recovery time objective and recovery point objective: acceptable downtime and data loss.'],['Privilege','Legal protection for certain communications with counsel.']];
const app=document.getElementById('app'),ticker=document.getElementById('ticker');let meters={},sceneIndex=0,decisions=[],name='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadName(){try{return localStorage.getItem('a2name')||''}catch(_){return ''}}function saveName(v){try{localStorage.setItem('a2name',v)}catch(_){}}
function meterHtml(){return '<div class="meters">'+METERS.map(([key,label])=>{const value=Math.max(0,Math.min(100,meters[key]||0));return '<div class="m">'+esc(label)+'<div class="bar"><i class="'+(value<35?'low':'')+'" style="width:'+value+'%"></i></div></div>'}).join('')+'</div>'}
function start(){meters={safety:60,trust:60,reg:60,evid:60,team:60};sceneIndex=0;decisions=[];ticker.textContent='BREAKING: Pharmacy payment outage spreads; Appointment 2 locations affected.';app.innerHTML='<h1>Appointment 2: you run the response</h1><div class="card"><p>You’re the incident lead at Appointment 2, a pharmacy with three locations. It��s the only pharmacy in a town of 150,000. A third-party payment tool nobody formally approved has stopped working, and patients are lining up.</p><p>Make six decisions. Every choice moves five meters, and there are no perfect answers, only trade-offs.</p><button class="go" id="begin" type="button">Begin</button></div>';document.getElementById('begin').onclick=showScene}
function showScene(){const s=R[sceneIndex];ticker.textContent=s.t+' · '+s.head;app.innerHTML=meterHtml()+'<section class="card"><div class="tag">'+esc(s.t)+'</div><h1>'+esc(s.head)+'</h1>'+s.inject.map(([who,text])=>'<div class="msg"><small>'+esc(who)+'</small>'+esc(text)+'</div>').join('')+'<p><b>'+esc(s.q)+'</b></p><div id="options"></div><div id="feedback"></div></section>';const box=document.getElementById('options');s.o.forEach((choice,k)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=choice[0];b.onclick=()=>choose(k);box.appendChild(b)})}
function choose(k){const choice=R[sceneIndex].o[k],bad=choice[3];Object.entries(choice[1]).forEach(([key,delta])=>meters[key]+=delta);decisions.push({round:R[sceneIndex].head,choice:choice[0],good:!bad});document.getElementById('options').className='hide';document.getElementById('feedback').innerHTML='<div class="fb'+(bad?' warn':'')+'"><p>'+esc(choice[2])+'</p><p>'+METERS.map(([key,label])=>{const d=choice[1][key]||0;return d?'<span class="'+(d>0?'up':'dn')+'">'+esc(label)+' '+(d>0?'+':'')+d+'</span>':''}).filter(Boolean).join(' · ')+'</p></div><button class="go" id="next" type="button">'+(sceneIndex<R.length-1?'Next':'See debrief')+'</button>';document.querySelector('.meters').outerHTML=meterHtml();document.getElementById('next').onclick=()=>{sceneIndex++;sceneIndex<R.length?showScene():debrief()}}
function debrief(){const avg=Math.round(Object.values(meters).reduce((a,b)=>a+b,0)/5),good=decisions.filter(x=>x.good).length;const verdict=avg>=75?'Steady hands. Patients stayed safe and the record is defensible.':avg>=55?'You held the line, but a few choices will cost you in the post-incident review.':'A rough response. Several decisions created legal, safety or trust problems that will outlast the outage.';ticker.textContent='RECOVERY: Services restored. Post-incident review begins.';app.innerHTML='<h1>Debrief</h1>'+meterHtml()+'<div class="card"><div class="tag">Overall</div><h1>'+avg+' / 100</h1><p>'+esc(verdict)+' You chose the strongest option in '+good+' of '+R.length+' rounds.</p></div><div class="card"><div class="tag">Your decisions</div><ul>'+decisions.map(x=>'<li>'+(x.good?'✓ ':'✗ ')+esc(x.round)+': <i>'+esc(x.choice)+'</i></li>').join('')+'</ul></div><div class="card"><div class="tag">Lessons from the exercise</div><ul>'+LESSONS.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="card"><div class="tag">Your reflection</div><p class="small">What would you do differently? (Stays on this page only.)</p><textarea placeholder="Write your reflection..."></textarea></div><button class="go" id="again" type="button">Play again</button>';document.getElementById('again').onclick=start}
function home(){ticker.textContent='ODTN News · Training portal';app.innerHTML='<h1>Defend the North: Pharmacy Crisis Lab</h1><div class="card"><p>This portal turns one module of a cyber-crisis tabletop exercise into a hands-on lesson. A payment tool nobody approved has failed, patients need medication, and you make the calls.</p><label class="tag" for="player-name">Your name (optional)</label><input id="player-name" type="text" placeholder="Incident lead name" value="'+esc(name)+'"><p><button class="go" id="go" type="button">Start the simulator</button></p></div><div class="card"><div class="tag">What’s inside</div><ul><li>Simulator: six decisions with live meters and a debrief</li><li>Newsroom: headlines and holding-statement checker</li><li>Glossary: search key terms</li></ul></div>';document.getElementById('go').onclick=()=>{name=document.getElementById('player-name').value.trim();saveName(name);location.hash='play'}}
function news(filter='All'){ticker.textContent='Newsroom · '+filter;const items=NEWS.filter(x=>filter==='All'||x[0]===filter);app.innerHTML='<h1>Newsroom</h1><div id="chips">'+CATS.map(c=>'<button type="button" class="chip '+(c===filter?'on':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'+items.map(x=>'<div class="card"><div class="tag">'+esc(x[0])+' · '+esc(x[1])+'</div><h2>'+esc(x[2])+'</h2><p>'+esc(x[3])+'</p></div>').join('')+'<div class="card"><div class="tag">Draft a holding statement</div><p class="small">Write what you would publish in the first hours. The checker looks for the basics.</p><textarea id="statement" placeholder="Appointment 2 is aware of..."></textarea><p><button class="go" id="check" type="button">Check my statement</button></p><div id="results" aria-live="polite"></div></div>';document.getElementById('chips').onclick=e=>{const c=e.target.dataset.category;if(c)news(c)};document.getElementById('check').onclick=()=>{const t=document.getElementById('statement').value.toLowerCase(),w=t.trim()?t.trim().split(/\s+/).length:0;const checks=[['States what we know',/payment|outage|system|disruption|service/.test(t)],['Says what we’re doing',/working|investigat|restor|monitor/.test(t)],['Tells people where to get help or updates',/call|contact|visit|update|phone|website|pharmacist/.test(t)],['Avoids blame and guesswork',w>0&&!/hack|attacker|nation|their fault|to blame/.test(t)],['Avoids the word “breach” (a legal call)',w>0&&!/breach/.test(t)],['Stays short (under 120 words)',w>0&&w<120]];document.getElementById('results').innerHTML=checks.map(([label,ok])=>'<p>'+(ok?'✓ ':'○ ')+esc(label)+'</p>').join('')}}
function glossary(){ticker.textContent='Glossary';app.innerHTML='<h1>Glossary</h1><label class="small" for="search">Search terms</label><input type="search" id="search" placeholder="Try breach"><dl id="terms"></dl>';const input=document.getElementById('search'),list=document.getElementById('terms');function render(){const q=input.value.toLowerCase(),matches=GL.filter(x=>(x[0]+x[1]).toLowerCase().includes(q));list.innerHTML=matches.length?matches.map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join(''):'<p class="small">No matches.</p>'}input.oninput=render;render()}
function route(){const hash=(location.hash||'#home').slice(1);document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+hash));if(hash==='play')start();else if(hash==='news')news();else if(hash==='glossary')glossary();else home()}
name=loadName();window.addEventListener('hashchange',route);route();
</script></body></html>
