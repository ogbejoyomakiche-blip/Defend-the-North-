<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ODTN Crisis Decision Simulator</title>
  <style>
    :root{
      --bg:#f6f4ef;--card:#fff;--ink:#1b1f24;--mute:#5d6670;--line:#dcd8cf;--red:#b3261e;--accent:#0b5e8a;--good:#1e7a46;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--ink:#eceae4;--mute:#9aa3ad;--line:#2e343c;--red:#ff6b61;--accent:#5bb4e5;--good:#5fd08a;--bad:#ff6b61;color-scheme:dark}
    }
    :root[data-theme="dark"]{--bg:#2b333d;--card:#1d2127;--ink:#eceae4;--mute:#9aa3ad;--line:#2e343c;--red:#ff6b61;--accent:#5bb4e5;--good:#5fd08a;--bad:#ff6b61;color-scheme:dark}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
    .wrap{max-width:720px;margin:0 auto;padding:14px}
    .brand{display:flex;align-items:center;gap:8px;font:700 13px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
    .brand b{background:var(--red);color:#fff;padding:4px 7px;border-radius:3px}
    .ticker{font:13px/1.4 system-ui,sans-serif;color:var(--mute);border-bottom:1px solid var(--line);padding:6px 0 10px;margin-bottom:12px}
    h1{font-size:26px;line-height:1.2;margin:10px 0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
    .tag{font:700 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
    .meters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
    .m{font:11px/1.2 system-ui,sans-serif;color:var(--mute)}
    .bar{height:8px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--accent);transition:width .4s,background .4s}
    .bar i.low{background:var(--bad)}
    button.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;cursor:pointer}
    button.opt:hover,button.opt:focus{border-color:var(--accent);outline:none}
    button.go{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:600 15px system-ui,sans-serif;cursor:pointer}
    .msg{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0;font-size:15px}
    .msg small{display:block;font:12px system-ui,sans-serif;color:var(--mute)}
    .fb{border-left:3px solid var(--good);padding-left:10px;margin:10px 0}
    .fb.warn{border-color:var(--bad)}
    .d{font:600 12px system-ui,sans-serif}
    .up{color:var(--good)} .dn{color:var(--bad)}
    .small{font:13px/1.4 system-ui,sans-serif;color:var(--mute)}
    ul{padding-left:20px}
    .hide{display:none}
    nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
    nav a{font:600 13px system-ui,sans-serif;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:20px}
    nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    input[type=text],input[type=search],textarea{width:100%;font:16px system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
    textarea{min-height:110px;resize:vertical}
    .chip{display:inline-block;font:600 12px system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:16px;margin:2px;cursor:pointer}
    .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .ck{font:14px/1.5 system-ui,sans-serif}.ck .y{color:var(--good)}.ck .n{color:var(--mute)}
    dt{font-weight:700;margin-top:10px}dd{margin:2px 0 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><b>ODTN</b> NEWS · SIMULATION </div>
    <nav id="nav"><a href="#home">Home</a><a href="#play">Simulator</a><a href="#news">News</a><a href="#glossary">Glossary</a></nav>
    <div class="ticker" id="ticker"></div>
    <div id="app"></div>
    <p class="small">Fictional scenario inspired by the Operation Defend the North tabletop exercise (CyberX).</p>
  </div>
  <script>
    const METERS = [["safety","Patient care"],["trust","Public trust"],["reg","Regulatory standing"],["evid","Evidence"],["team","Team wellbeing"]];
    const R = [
      {t:"Hour 1 · Saturday 9:40 a.m.",head:"Payments are down at all three pharmacies",inject:[["ODTN News","Cyber incident halts prescription refills and essential purchases, putting patients’ health at serious risk."],["Mark (IT)","Card terminals are dead. The ODN Pay vendor says the last update went through, but everything is broken. They urge us to turn the system off."]],q:"The vendor wants the server powered off. You don’t yet know if this is an attack. What do you do?",o:[["Power it off as the vendor asks",{safety:5,trust:0,reg:-5,evid:-20,team:0},"Powering off can erase volatile logs and evidence. Your technical leads warned against it. The vendor’s odd insistence deserved questions, not obedience.",true],["Disconnect it from the network but leave it powered on",{safety:0,trust:0,reg:5,evid:15,team:0},"Good call. Isolating without shutting down contains the risk and preserves forensic evidence.",false],["Leave it running and wait for the vendor’s patch",{safety:-5,trust:-5,reg:-5,evid:-5,team:0},"Waiting leaves an unknown risk connected to your network, and your counter staff still can’t take payments.",true]]},
      {t:"Hour 2 · 10:25 a.m.",head:"An unapproved email goes to staff and customers",inject:[["Email from Andrew (Business Dev)","Hello team, ODN Pay is having an issue. Please tell customers we’re working with our partners. Consider manual payment options or holding prescriptions for pickup."],["Ian (Business Dev manager)","Andrew shouldn’t have sent that, but customers need to hear something or they’ll lose faith in us."]],q:"Andrew’s email wasn’t authorized. How do you handle it?",o:[["Let it stand. Customers need information and it’s harmless",{safety:3,trust:-5,reg:-10,evid:0,team:-3},"One unapproved message today means many conflicting ones tomorrow. It also bypassed legal review.",true],["Quietly ask staff to ignore it and say nothing publicly",{safety:-3,trust:-10,reg:-3,evid:0,team:-5},"Silence leaves people guessing, and the email has already gone out.",true],["Have comms issue one approved holding message and name a single spokesperson",{safety:3,trust:10,reg:8,evid:0,team:5},"Right move. A single authorized voice, reviewed by legal, stops conflicting messages before they spread.",false]]},
      {t:"Hour 4 · 12:30 p.m.",head:"The word that changes everything",inject:[["Board adviser","The board wants to know: is this a breach?"],["Legal","Once we say “breach,” notification clocks start for regulators and individuals."]],q:"There is no evidence yet that data was accessed. What do you call this?",o:[["“A confirmed data breach”",{safety:0,trust:-10,reg:-15,evid:0,team:-3},"Premature. Declaring a breach without evidence triggers regulatory timelines and panic you may not need.",true],["“A suspected security incident under investigation”",{safety:0,trust:5,reg:12,evid:0,team:3},"Correct. Accurate and cautious. It keeps your options open without understating the situation.",false],["“Just an IT outage”",{safety:0,trust:-5,reg:-12,evid:0,team:0},"Dangerous. If it later turns out to be an attack, this looks like a cover-up. Failed logins and the odd vendor behaviour already suggest otherwise.",true]]},
      {t:"Hour 6 · 2:15 p.m.",head:"Roll back, or bring in something new?",inject:[["IT Ops","Option A: roll back to last week’s version, but it carries a critical vulnerability. Option B: emergency cellular payment provider, but nobody is trained on it."],["Incident Commander","Whatever we pick, I want it documented and auditable."]],q:"Which path do you approve?",o:[["Roll back, add compensating controls, and keep the current state preserved",{safety:5,trust:3,reg:5,evid:10,team:-3},"Reasonable. You accept known risk but mitigate it and protect evidence. The roll back is documented and reversible.",false],["Deploy the untested emergency provider",{safety:6,trust:-3,reg:-10,evid:0,team:-8},"It restores payments fast, but creates governance, training and audit gaps during an incident.",true],["Do neither and wait for the vendor’s patch",{safety:-10,trust:-8,reg:-3,evid:0,team:0},"Patients still can’t get medication. Waiting without a plan B is a choice, and a costly one.",true]]},
      {t:"Hour 8 · 4:00 p.m.",head:"Patients are waiting for insulin",inject:[["ODTN News","A woman with diabetes tells our reporter she has waited all morning. “I can’t take the insulin shot without my breakfast.”"],["Store manager","We could dispense what’s urgent and settle payments later."]],q:"How do you get urgent medication to people?",o:[["Triage by urgency, use ID plus the prescription, and collect payment later",{safety:15,trust:10,reg:3,evid:0,team:-2},"Best answer. A manual, documented triage keeps people safe and keeps a paper trail for later reconciliation.",false],["Stay closed until systems are back",{safety:-20,trust:-15,reg:0,evid:0,team:0},"Patient safety comes first. Life-saving medication can’t wait on a payment terminal.",true],["Hand out medication freely with no records",{safety:8,trust:2,reg:-15,evid:0,team:-3},"Compassionate but reckless. No records means inventory, insurance, billing and audit problems.",true]]},
      {t:"Hour 12 · 8:00 p.m.",head:"The mayor’s office asks: who’s attacking us?",inject:[["Mayor’s office","We’re a small town. If we’re under attack, why, and by whom? Council needs something to say tonight."],["Threat intel","We have IP addresses and logs. Attribution is not our call to make."]],q:"How do you respond?",o:[["Share indicators with CCCS and the RCMP, tell the mayor attribution is for them",{safety:0,trust:8,reg:10,evid:5,team:3},"Right. Stick to your role: protect the organization, hand intelligence to agencies that can attribute properly.",false],["Tell the mayor it’s probably a nation state",{safety:0,trust:-10,reg:-8,evid:0,team:0},"Speculation spreads fast and can cause real harm if wrong.",true],["Don’t respond to the mayor’s office",{safety:0,trust:-8,reg:-5,evid:0,team:0},"Silence from the only pharmacy in town breeds rumor. A calm, factual reply costs little.",true]]}
    ];
    const LESSONS=["Preserve evidence: disconnect, don’t power off.","One approved voice. Hold statements ready before you need them.","Say “suspected incident” until legal confirms a breach.","Shadow IT is a governance failure. Vendors need inventory, monitoring and a continuity plan.","Patient safety beats payment systems. Have a manual downtime process.","Leave attribution to law enforcement and CCCS. Share your indicators."];
    const app=document.getElementById("app");
    const tk=document.getElementById("ticker");
    const escapeHtml=(v)=>String(v).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    let m={},i=0,log=[],NAME=getStoredName();
    function getStoredName(){try{return localStorage.getItem("a2name")||""}catch(e){return ""}}
    function setStoredName(v){try{localStorage.setItem("a2name",v)}catch(e){}}
    function meterHtml(){return '<div class="meters">'+METERS.map(function(x){var v=Math.max(0,Math.min(100,m[x[0]]));return '<div class="m">'+escapeHtml(x[1])+'<div class="bar"><i class="'+(v<35?"low":"")+'" style="width:'+v+'%"></i></div></div>'}).join("")+'</div>'}
    function start(){m={safety:60,trust:60,reg:60,evid:60,team:60};i=0;log=[];tk.textContent="BREAKING: Pharmacy payment outage spreads; Appointment 2 locations affected.";app.innerHTML='<h1>Appointment 2: you run the response</h1><div class="card"><p>You’re the incident lead at Appointment 2, a pharmacy with three locations. It’s the only pharmacy in a town of 150,000. A third-party payment tool you didn’t formally approve has stopped working, and patients are lining up.</p><p>Make six decisions. Every choice moves five meters, and there are no perfect answers, only trade-offs.</p><button class="go" id="s">Begin</button></div>';document.getElementById("s").onclick=show}
    function show(){var r=R[i];tk.textContent=r.t+" · "+r.head;var h=meterHtml()+'<div class="card"><div class="tag">'+escapeHtml(r.t)+'</div><h1>'+escapeHtml(r.head)+'</h1>'+r.inject.map(function(x){return '<div class="msg"><small>'+escapeHtml(x[0])+'</small>'+escapeHtml(x[1])+'</div>'}).join("")+ '<p><b>'+escapeHtml(r.q)+'</b></p><div id="opts"></div><div id="out"></div></div>';app.innerHTML=h;var o=document.getElementById("opts");r.o.forEach(function(c,k){var b=document.createElement("button");b.className="opt";b.textContent=c[0];b.onclick=function(){pick(k)};o.appendChild(b)})}
    function pick(k){var c=R[i].o[k],e=c[1];for(var key in e){m[key]+=e[key]}log.push({r:R[i].head,c:c[0],good:!c[3]});var d=METERS.map(function(x){var v=e[x[0]];return v?'<span class="d '+(v>0?"up":"dn")+'">'+escapeHtml(x[1])+" "+(v>0?"+":"")+v+'</span>':""}).filter(Boolean).join(" · ");document.getElementById("opts").className="hide";document.getElementById("out").innerHTML='<div class="fb'+(c[3]?" warn":"")+'"><p>'+escapeHtml(c[2])+'</p><p>'+d+'</p></div><button class="go" id="n">'+(i<R.length-1?"Next":"See debrief")+'</button>';document.querySelector(".meters").outerHTML=meterHtml();document.getElementById("n").onclick=function(){i++;i<R.length?show():end()}}
    function end(){var avg=Math.round((m.safety+m.trust+m.reg+m.evid+m.team)/5);var g=log.filter(function(x){return x.good}).length;var verdict=avg>=75?"Steady hands. Patients stayed safe and the record is defensible.":avg>=55?"You held the line, but a few choices will cost you in the post-incident review.":"A rough response. Several decisions created legal, safety or trust problems that will outlast the outage.";tk.textContent="RECOVERY: Services restored. Post-incident review begins.";app.innerHTML='<h1>Debrief</h1>'+meterHtml()+'<div class="card"><div class="tag">Overall</div><h1>'+avg+' / 100</h1><p>'+escapeHtml(verdict)+' You chose the strongest option in '+g+' of '+R.length+' rounds.</p></div><div class="card"><div class="tag">Your decisions</div><ul>'+log.map(function(x){return '<li>'+(x.good?"✓ ":"✗ ")+escapeHtml(x.r)+': <i>'+escapeHtml(x.c)+'</i></li>'}).join("")+'</ul></div><div class="card"><div class="tag">Lessons from the exercise</div><ul>'+LESSONS.map(function(x){return "<li>"+escapeHtml(x)+"</li>"}).join("")+'</ul></div><div class="card"><div class="tag">Your reflection</div><p class="small">What would you do differently? (Stays on this page only.)</p><textarea id="jn" placeholder="'+(NAME?escapeHtml(NAME)+', ':'')+'my biggest lesson was..."></textarea></div><button class="go" id="r">Play again</button>';document.getElementById("r").onclick=start}
    var NEWS=[["Retail","Payments","Rocket Ledger Express terminals fail before the holidays","Merchants across Canada report they cannot process card payments after an update to third-party payment software."],["Healthcare","Pharmacy","Cyber incident halts prescription refills","Pharmacies report they cannot fill insulin and heart medication as the ODN Pay software stops working."],["Healthcare","Patients","Patients wait hours for insulin","A woman with diabetes says she cannot take her shot without breakfast and has waited all morning."],["Government","Municipality","Tax payments fail in 37 Lakes","Residents report declined payments and double charges as the town investigates remote root logins."],["Transit","Riders","Transit card refills fail","Riders cannot refill cards, and an unauthorized alert tells them to find other ways to pay."],["Vendor","Root cause","Vendor’s SSH library was misconfigured","Investigators say a late patch and a misconfiguration put development keys into customer systems."]];
    var CATS=["All","Retail","Healthcare","Government","Transit","Vendor"];
    var GL=[["Shadow IT","Software the business adopts without IT or security approval. It has no monitoring, governance or continuity plan."],["Incident vs breach","An incident is an event that may harm security. A breach is a legal finding of unauthorized access to data and starts notification deadlines."],["IOC","Indicator of compromise: a clue such as an IP address or file hash that suggests an attack."],["Containment","Stopping the spread of a problem without destroying evidence."],["Eradication","Removing the cause, such as malicious files or bad credentials, from the environment."],["Playbook","A pre-written set of steps and roles for a type of incident."],["Incident commander","The single person coordinating the response and decisions."],["SIEM","A tool that collects and correlates logs from many systems to spot suspicious activity."],["Forensics","Careful collection and analysis of evidence. Powering a system off can destroy volatile evidence."],["Third-party risk","Exposure created by vendors and partners who touch your systems or data."],["RTO / RPO","Recovery time objective and recovery point objective: how long you can be down and how much data you can lose."],["Privilege","Legal protection for communications with counsel, which is why incident discussions are routed through lawyers."]];
    function home(){tk.textContent="ODTN News · Training portal";app.innerHTML='<h1>Defend the North: Pharmacy Crisis Lab</h1><div class="card"><p>This portal turns one module of a cyber-crisis tabletop exercise into a hands-on lesson. A payment tool nobody approved has failed, patients need medication, and you make the calls.</p><div class="tag">Your name (optional)</div><input type="text" id="nm" placeholder="Incident lead name" value="'+escapeHtml(NAME)+'"><p><button class="go" id="go">Start the simulator</button></p></div><div class="card"><div class="tag">What’s inside</div><ul><li><b>Simulator:</b> six decisions with live meters and a debrief</li><li><b>Newsroom:</b> filter the headlines and draft your own holding statement</li><li><b>Glossary:</b> search the key terms</li></ul></div>';document.getElementById("go").onclick=function(){NAME=document.getElementById("nm").value.trim();setStoredName(NAME);location.hash="play"}}
    function news(f){f=f||"All";tk.textContent="Newsroom · "+f;var list=NEWS.filter(function(n){return f=="All"||n[0]==f});app.innerHTML='<h1>Newsroom</h1><div id="chips">'+CATS.map(function(c){return '<span class="chip'+(c==f?" on":"")+'" data-c="'+escapeHtml(c)+'">'+escapeHtml(c)+'</span>'}).join("")+'</div>'+list.map(function(n){return '<div class="card"><div class="tag">'+escapeHtml(n[0])+' · '+escapeHtml(n[1])+'</div><h2 style="margin:6px 0">'+escapeHtml(n[2])+'</h2><p>'+escapeHtml(n[3])+'</p></div>'}).join("")+ '<div class="card"><div class="tag">Draft a holding statement</div><p class="small">Write what you would publish in the first hours. The checker looks for the basics.</p><textarea id="st" placeholder="Appointment 2 is aware of..."></textarea><p><button class="go" id="ck">Check my statement</button></p><div id="res" class="ck"></div></div>';document.getElementById("chips").onclick=function(e){var c=e.target.getAttribute("data-c");if(c)news(c)};document.getElementById("ck").onclick=function(){var t=document.getElementById("st").value.toLowerCase();var w=t.trim()?t.trim().split(/\s+/).length:0;var T=[["States what we know",/payment|outage|system|disruption|service/.test(t)],["Says what we’re doing",/working|investigat|restor|monitor/.test(t)],["Tells people where to get help or updates",/call|contact|visit|update|phone|website|pharmacist/.test(t)],["Avoids blame and guesswork",w>0&&!/hack|attacker|nation|their fault|to blame/.test(t)],["Avoids the word “breach” (a legal call)",w>0&&!/breach/.test(t)],["Stays short (under 120 words)",w>0&&w<120]];document.getElementById("res").innerHTML=T.map(function(x){return '<div><span class="'+(x[1]?"y":"n")+'">'+(x[1]?"✓":"○")+'</span> '+escapeHtml(x[0])+'</div>'}).join("")}}}
    function glossary(){tk.textContent="Glossary";app.innerHTML='<h1>Glossary</h1><input type="search" id="q" placeholder="Search terms (try breach)"><dl id="dl"></dl>';var inp=document.getElementById("q"),dl=document.getElementById("dl");function r(){var v=inp.value.toLowerCase();var h=GL.filter(function(g){return (g[0]+g[1]).toLowerCase().indexOf(v)>-1}).map(function(g){return '<dt>'+escapeHtml(g[0])+'</dt><dd>'+escapeHtml(g[1])+'</dd>'}).join("");dl.innerHTML=h||'<p class="small">No matches.</p>'}inp.oninput=r;r()}
    function route(){var h=(location.hash||"#home").slice(1);var as=document.querySelectorAll("#nav a");for(var k=0;k<as.length;k++)as[k].className=as[k].getAttribute("href")=="#"+h?"on":"";if(h=="play")start();else if(h=="news")news();else if(h=="glossary")glossary();else home()}window.addEventListener("hashchange",route);route();
  </script>
</body>
</html>
